<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>已讀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
<!-- 封面圖寫在 style.css 裡，瀏覽器要讀完 CSS 才會開始下載；這裡先叫它下載，開始畫面才不會空一下 -->
<link rel="preload" as="image" href="img/000.jpg" fetchpriority="high">
</head>
<body>
<!-- APP START -->
<div id="app">
  <!-- 繪本：插圖填滿整個螢幕，旁白在下方的對話框 -->
  <div id="story">
    <figure id="scene">
      <!-- 運鏡（推近、拉遠、平移）動的是這一層 -->
      <div id="camera">
        <div id="scene-ph" class="placeholder" hidden></div>
        <img id="scene-img" alt="">
      </div>
    </figure>
    <section id="caption" class="empty" aria-live="polite">
      <span id="caption-who" hidden></span>
      <p id="caption-text"></p>
    </section>
  </div>

  <!-- 手機：從右邊滑進來 -->
  <section id="phone" aria-label="手機畫面">
    <div class="screen">
      <div class="status">
        <span id="clock"></span>
        <span class="notch" aria-hidden="true"></span>
        <span class="status-icons" aria-hidden="true">
          <svg class="solid" viewBox="0 0 24 24"><rect x="2" y="15" width="3.4" height="6" rx="1"/><rect x="7.2" y="11" width="3.4" height="10" rx="1"/><rect x="12.4" y="7" width="3.4" height="14" rx="1"/><rect x="17.6" y="3" width="3.4" height="18" rx="1"/></svg>
          <svg viewBox="0 0 24 24"><path d="M2.5 9.5a14 14 0 0 1 19 0M5.8 13a9.2 9.2 0 0 1 12.4 0M9 16.5a4.6 4.6 0 0 1 6 0"/><circle cx="12" cy="20" r="0.8"/></svg>
          <span>61%</span>
          <span class="battery"></span>
        </span>
      </div>
      <header id="chat-bar">
        <span class="back" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M15 4.5 7.5 12l7.5 7.5"/></svg></span>
        <span id="chat-title"></span>
        <span class="bar-icons" aria-hidden="true">
          <svg class="solid" viewBox="0 0 24 24"><path d="M6.6 2.8h3l1.6 4.4-2.1 1.6a11.5 11.5 0 0 0 6.1 6.1l1.6-2.1 4.4 1.6v3a2 2 0 0 1-2.1 2A17.3 17.3 0 0 1 4.6 4.9a2 2 0 0 1 2-2.1z"/></svg>
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </span>
      </header>
      <div id="notify" role="status"></div>
      <div id="log" aria-live="polite"></div>
      <div class="inputbar">
        <span class="tools" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 4.5v15M4.5 12h15"/></svg>
          <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M8.5 7 10 4h4l1.5 3"/><circle cx="12" cy="13.5" r="3.5"/></svg>
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="15.5" cy="9" r="2"/><path d="m3 17 5-5 4 4 2.5-2.5L21 19"/></svg>
        </span>
        <span class="field">
          <span id="draft"></span>
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0M9 9.5v.5M15 9.5v.5"/></svg>
        </span>
        <span class="send" aria-hidden="true">
          <svg class="to-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
          <svg class="to-send" viewBox="0 0 24 24"><path d="M21 3 3 10.5l7 2.5 2.5 7zM10 13l11-10"/></svg>
        </span>
      </div>
    </div>
  </section>

  <!-- 選項（手機開著時出現在手機下方，否則出現在畫面中間） -->
  <div id="choices"></div>

  <!-- 黑幕、白幕（fadeOut / fadeIn） -->
  <div id="curtain"></div>

  <!-- 地點字條：黑底白字（place） -->
  <div id="place" aria-live="polite">
    <p id="place-text"></p>
    <p id="place-sub" hidden></p>
  </div>

  <!-- 轉場黑幕 -->
  <div id="card">
    <p id="card-text"></p>
    <p id="card-sub" hidden></p>
    <span class="card-hint">點一下繼續</span>
    <button id="card-btn" class="pill" type="button" hidden>從頭再玩</button>
  </div>

  <!-- 結局卡：標題、副標、三行結果、引言，看過哪些結局、隱藏章節解鎖了沒 -->
  <div id="ending" aria-live="polite">
    <div class="ending-inner">
      <p id="ending-no"></p>
      <h2 id="ending-title"></h2>
      <p id="ending-tagline" hidden></p>
      <ul id="ending-results" hidden></ul>
      <p id="ending-quote" hidden></p>
      <ul id="ending-list"></ul>
      <p id="ending-unlock" hidden></p>
      <div class="ending-actions">
        <button id="ending-retry" class="pill" type="button" hidden></button>
        <button id="ending-secret" class="pill" type="button" hidden></button>
        <button id="ending-again" class="pill ghost" type="button">從頭再玩</button>
      </div>
    </div>
  </div>

  <!-- 開始畫面：封面圖（img/000.jpg，在 style.css 設定）填滿整個螢幕，按鈕在右下角 -->
  <div id="start">
    <div class="start-inner">
      <div class="start-actions">
        <button id="start-btn" class="pill" type="button">開始</button>
        <button id="secret-btn" class="pill ghost" type="button" hidden></button>
      </div>
      <p class="start-tip" id="start-endings" hidden></p>
      <p class="start-tip" id="start-tip">點擊滑鼠或按空白鍵繼續，按 1、2 選擇。<br>開始後會切換成全螢幕，按 Esc 可以離開。</p>
    </div>
  </div>

  <!-- 按下開始後閃過的耳機提示 -->
  <div id="notice" class="system-screen" aria-live="polite">
    <svg class="system-icon" viewBox="0 0 64 64" aria-hidden="true">
      <path d="M14 40 V32 a18 18 0 0 1 36 0 V40"/>
      <rect x="9" y="37" width="11" height="17" rx="5.5"/>
      <rect x="44" y="37" width="11" height="17" rx="5.5"/>
    </svg>
    <p>戴上耳機，效果更佳</p>
  </div>
</div>

<!-- 手機直著拿時：請橫放 -->
<div id="rotate" class="system-screen">
  <svg class="system-icon" viewBox="0 0 64 64" aria-hidden="true">
    <path class="arrow" d="M10 24 A23 23 0 0 1 28 8 M28 8 l-6 -1.5 M28 8 l-2.5 5.5"/>
    <g class="turn">
      <rect x="21" y="14" width="22" height="38" rx="4"/>
      <path d="M29 18.5 h6"/>
    </g>
  </svg>
  <p>請將手機橫放</p>
  <p class="sub">電腦請把瀏覽器視窗拉寬</p>
</div>

<!-- 全螢幕按鈕、開發者面板與錯誤提示 -->
<button id="fs-btn" type="button">全螢幕</button>
<div id="dev" hidden></div>
<div id="problems" role="alert" hidden></div>
<!-- APP END -->

<script src="story.js"></script>
<script src="engine.js"></script>
</body>
</html>
